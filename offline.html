<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - TechNova Solutions</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <meta name="theme-color" content="#ff6b5b">
</head>
<body>
    <main class="status-container">
        <div class="feature-icon" style="width:72px;height:72px;margin:0 auto 1.75rem;">
            <svg class="icon icon-xl" viewBox="0 0 24 24" style="color:var(--primary-color)" aria-hidden="true"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 3.3-2.2M19 12.9a10 10 0 0 0-6.6-2.8"/><path d="M1.6 9.3a15 15 0 0 1 4.5-2.7M22.4 9.3a15 15 0 0 0-9.2-3.2"/><circle cx="12" cy="20" r="1"/></svg>
        </div>
        <h1>You are offline</h1>
        <p>The connection dropped. Nothing you were working on is lost, and this page will reload itself once you are back.</p>
        <div class="status-actions">
            <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
            <a href="index.html" class="btn btn-secondary">Go to Homepage</a>
        </div>
    </main>

    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
